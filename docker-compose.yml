services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/jobs.db
      - EMBEDDING_MODEL=paraphrase-multilingual-MiniLM-L12-v2
      - ARTIFACTS_DIR=./artifacts
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./mlruns:/app/mlruns
